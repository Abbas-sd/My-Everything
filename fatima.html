<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لفاطمة 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#f7c9d8;
    --pink-deep:#f3a9c4;
    --sky:#aee1f9;
    --sky-deep:#8fd0f3;
    --white:#ffffff;
    --ink:#4a3b52;
    --ink-soft:#7a6b82;
    --star-pink:#f2a6c6;
    --star-blue:#8fcdef;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background: linear-gradient(150deg, var(--sky) 0%, var(--white) 45%, var(--pink) 100%);
    background-attachment:fixed;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 22px 64px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eng-label{
    font-family:'Poppins', sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    opacity:0.7;
    margin-bottom:6px;
  }

  h1.name{
    font-size:clamp(34px, 8vw, 52px);
    font-weight:800;
    margin:0 0 2px;
    background:linear-gradient(90deg, #d16b95, #6fa8c9);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .canvas-wrap{
    position:relative;
    width:min(78vw, 340px);
    aspect-ratio:1/1;
    margin: 18px 0 8px;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }

  .tagline{
    text-align:center;
    font-size:17px;
    color:var(--ink-soft);
    margin:0 0 34px;
    font-weight:400;
  }

  /* Countdown */
  .countdown-card{
    width:100%;
    background:rgba(255,255,255,0.65);
    backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,0.8);
    border-radius:20px;
    padding:22px 18px 24px;
    box-shadow: 0 10px 30px -14px rgba(160, 110, 150, 0.35);
    margin-bottom:28px;
  }
  .countdown-title{
    text-align:center;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .countdown-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .cd-unit{
    background:var(--white);
    border-radius:14px;
    padding:12px 4px;
    text-align:center;
    box-shadow: 0 4px 14px -8px rgba(160,110,150,0.4);
  }
  .cd-num{
    font-family:'Poppins', sans-serif;
    font-size:clamp(20px, 5.5vw, 28px);
    font-weight:600;
    color:#c65c8c;
    line-height:1.1;
  }
  .cd-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.02em;
  }
  .exam-date{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:14px;
    font-family:'Poppins', sans-serif;
    opacity:0.75;
  }

  /* Message card */
  .message-card{
    width:100%;
    background:var(--white);
    border-radius:24px;
    padding:34px 26px;
    box-shadow: 0 14px 40px -18px rgba(160, 110, 150, 0.45);
    position:relative;
    overflow:hidden;
  }
  .message-card::before{
    content:"";
    position:absolute;
    top:-40px;
    right:-40px;
    width:140px;
    height:140px;
    background: radial-gradient(circle, var(--pink) 0%, transparent 70%);
    opacity:0.6;
  }
  .message-card::after{
    content:"";
    position:absolute;
    bottom:-40px;
    left:-40px;
    width:140px;
    height:140px;
    background: radial-gradient(circle, var(--sky) 0%, transparent 70%);
    opacity:0.6;
  }
  .message-text{
    position:relative;
    font-size:clamp(19px, 4.6vw, 23px);
    line-height:2.1;
    font-weight:500;
    color:var(--ink);
    text-align:center;
    white-space:pre-line;
  }
  .heart-emoji{
    color:#e39ab8;
  }

  footer{
    margin-top:36px;
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    opacity:0.6;
    font-family:'Poppins', sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eng-label">FOR THE FUTURE DOCTOR</div>
  <h1 class="name">فاطمة</h1>

  <div class="canvas-wrap">
    <canvas id="c" width="600" height="600"></canvas>
  </div>

  <p class="tagline">٥٠٠ نجمة، كل وحدة فيها دعوة إلك</p>

  <div class="countdown-card">
    <div class="countdown-title">الوقت المتبقي لامتحانك</div>
    <div class="countdown-grid">
      <div class="cd-unit"><div class="cd-num" id="cd-days">-</div><div class="cd-label">يوم</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-hours">-</div><div class="cd-label">ساعة</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-mins">-</div><div class="cd-label">دقيقة</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-secs">-</div><div class="cd-label">ثانية</div></div>
    </div>
    <div class="exam-date" id="exam-note">الامتحان بتاريخ ٢٤ أيلول</div>
  </div>

  <div class="message-card">
    <div class="message-text">إن شاء الله يا حياتي لح تصيري أحلى دكتورة <span class="heart-emoji">🤍</span>
عم ادعيلك كل لحظة يا قلبي
ما تنسي ليش فتّيتي هالاختصاص يا روحي
بحبك <span class="heart-emoji">🤍</span></div>
  </div>

  <footer>بالتوفيق يا دكتورة فاطمة ✨</footer>
</div>

<script>
// ---------- Heart of stars animation (pink + sky blue palette) ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2;

const N = 500;
const STEPS = 50;
const FRAME_MS = 25;
const PAUSE_MS = 1600;

function rand(min, max){ return Math.random() * (max - min) + min; }
function randInt(min, max){ return Math.floor(rand(min, max+1)); }

function buildStars(){
  const stars = [];
  for(let i=0;i<N;i++){
    const a = 2*Math.PI*(i/N);
    const baseX = 16 * Math.pow(Math.sin(a),3) * 8.2;
    const baseY = (13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a)) * 8.2;

    const tx = baseX + rand(-12,12);
    const ty = baseY + rand(-12,12);

    const sx = randInt(-260,260);
    const sy = randInt(-260,260);
    const size = rand(2,4.5);
    const color = Math.random() < 0.5 ? '#f2a6c6' : '#8fcdef';

    stars.push({sx, sy, tx, ty, size, color});
  }
  return stars;
}

function toCanvas(x, y){
  return [CX + x, CY - y];
}

function drawStar(x, y, size, color){
  const [cx, cy] = toCanvas(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  [0,45,90,135].forEach(angleDeg => {
    const rad = angleDeg * Math.PI/180;
    const dx = size * Math.cos(rad);
    const dy = size * Math.sin(rad);
    const [x1,y1] = toCanvas(x - dx, y - dy);
    const [x2,y2] = toCanvas(x + dx, y + dy);
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
  });
  ctx.stroke();
}

function easeSin(progress){
  return Math.sin(progress * Math.PI / 2);
}

let stars = buildStars();
let frame = 0;
let holding = false;
let holdStart = 0;

function render(now){
  if(holding){
    if(now - holdStart >= PAUSE_MS){
      holding = false;
      stars = buildStars();
      frame = 0;
    }
    requestAnimationFrame(render);
    return;
  }

  ctx.clearRect(0,0,W,H);
  const progress = frame / STEPS;
  const eased = easeSin(progress);

  for(const s of stars){
    const cx = s.sx + (s.tx - s.sx) * eased;
    const cy = s.sy + (s.ty - s.sy) * eased;
    drawStar(cx, cy, s.size, s.color);
  }

  frame++;
  if(frame > STEPS){
    holding = true;
    holdStart = now;
    requestAnimationFrame(render);
    return;
  }
  setTimeout(() => requestAnimationFrame(render), FRAME_MS);
}
requestAnimationFrame(render);

// ---------- Countdown to exam ----------
// Exam date: September 24, 2026, start of day (local time)
const examDate = new Date(2026, 8, 24, 0, 0, 0);

function updateCountdown(){
  const now = new Date();
  let diff = examDate - now;

  const daysEl = document.getElementById('cd-days');
  const hoursEl = document.getElementById('cd-hours');
  const minsEl = document.getElementById('cd-mins');
  const secsEl = document.getElementById('cd-secs');
  const note = document.getElementById('exam-note');

  if(diff <= 0){
    daysEl.textContent = '0';
    hoursEl.textContent = '0';
    minsEl.textContent = '0';
    secsEl.textContent = '0';
    note.textContent = 'بالتوفيق اليوم يا دكتورة 🤍';
    return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff / (1000*60*60)) % 24);
  const mins = Math.floor((diff / (1000*60)) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  daysEl.textContent = days;
  hoursEl.textContent = hours;
  minsEl.textContent = mins;
  secsEl.textContent = secs;
}
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
