<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بحبك يا أحلى وردة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04040c;overflow:hidden}
  body{font-family:'Cairo',sans-serif;color:#ffd6e6}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  #quote{
    position:fixed;top:max(5vh,28px);left:0;right:0;text-align:center;z-index:3;padding:0 16px;
    font-family:'Aref Ruqaa',serif;font-weight:700;font-size:clamp(30px,7.5vw,56px);line-height:1.5;
    color:#ffe3ee;text-shadow:0 0 18px rgba(255,150,190,.55);min-height:1.6em;
  }
  #quote .caret{display:inline-block;width:2px;height:.9em;background:#ffb6cf;margin-inline-start:6px;vertical-align:middle;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #intro{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:#04040c;transition:opacity 1s ease,visibility 1s;
  }
  #intro.hide{opacity:0;visibility:hidden}
  #intro .rose{font-size:60px;animation:pulse 2s ease-in-out infinite}
  #intro p{font-family:'Aref Ruqaa',serif;font-size:26px;color:#f6d9a8}
  #openBtn{
    font-family:'Cairo',sans-serif;font-size:18px;padding:13px 38px;border-radius:999px;border:1px solid #ff9ec0;
    background:rgba(255,158,192,.12);color:#ffd6e6;cursor:pointer;transition:.3s;
  }
  #openBtn:hover{background:#ff9ec0;color:#2a0f1c;transform:scale(1.05)}
  @keyframes pulse{50%{transform:scale(1.15)}}

  #music{
    position:fixed;top:14px;left:14px;z-index:5;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,158,192,.6);background:rgba(4,4,12,.6);color:#ffd6e6;font-size:18px;cursor:pointer;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="quote"></div>
<button id="music" aria-label="music">🎵</button>

<div id="intro">
  <div class="rose">🌹</div>
  <p>في شي إلك</p>
  <button id="openBtn">افتحي</button>
</div>

<audio id="audio" src="music.mp3" loop preload="auto"></audio>

<script src="points.js"></script>
<script>
(() => {
  const TEXT = 'بحبك يا أحلى وردة';
  const COLORS = ['#ffa5b9','#cda5ff','#a5d2ff','#ffd7af','#ffbed7'];

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const quote = document.getElementById('quote');
  const audio = document.getElementById('audio');
  let W, H, dpr, scale, ox, oy;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const topSpace = Math.max(H*0.17, 90);
    const availH = H - topSpace - H*0.03;
    scale = Math.min(W*0.98/EDGE.w, availH/EDGE.h);
    ox = (W - EDGE.w*scale)/2;
    oy = topSpace + (availH - EDGE.h*scale)/2;
    parts.forEach(p => { p.tx = ox + p.sx*scale; p.ty = oy + p.sy*scale; });
  }

  // particles
  const parts = EDGE.p.map(([x,y]) => ({
    sx:x, sy:y, tx:0, ty:0,
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6,
    c:Math.floor(Math.random()*COLORS.length),
    s:.7+Math.random()*1.3,
    ph:Math.random()*6.28, delay:Math.random()
  }));
  // background stars
  const stars = Array.from({length:130},()=>({
    x:Math.random(), y:Math.random(), r:Math.random()*1.2+.3, ph:Math.random()*6.28
  }));
  resize(); addEventListener('resize', resize);

  let t0 = null, typed = false;
  const GATHER = 7000;   // ms for particles to fly in

  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

  function frame(now){
    if(t0===null) t0 = now;
    const t = now - t0;
    ctx.fillStyle = 'rgba(4,4,12,.35)';
    ctx.fillRect(0,0,W,H);

    // stars
    for(const s of stars){
      const a = .25 + .35*Math.sin(now/700 + s.ph);
      ctx.fillStyle = `rgba(255,220,235,${a})`;
      ctx.fillRect(s.x*W, s.y*H, s.r, s.r);
    }

    const buckets = COLORS.map(()=>[]);
    for(const p of parts){
      const local = Math.min(1, Math.max(0, (t - p.delay*GATHER*0.55) / (GATHER*0.45)));
      const k = ease(local);
      let x, y;
      if(local < 1){
        // drift while waiting, then glide to target
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>W) p.vx*=-1;
        if(p.y<0||p.y>H) p.vy*=-1;
        x = p.x + (p.tx - p.x)*k;
        y = p.y + (p.ty - p.y)*k;
      } else {
        x = p.tx + Math.sin(now/900 + p.ph)*.6;
        y = p.ty + Math.cos(now/1100 + p.ph)*.6;
      }
      p.rx = x; p.ry = y;
      buckets[p.c].push(p);
    }
    const tw = now/260;
    buckets.forEach((arr,i)=>{
      ctx.fillStyle = COLORS[i];
      for(const p of arr){
        const sz = p.s * (0.8 + 0.5*Math.sin(tw + p.ph)) * Math.max(1.1, scale*2.4);
        ctx.globalAlpha = .7 + .3*Math.abs(Math.sin(tw*.7 + p.ph));
        ctx.fillRect(p.rx, p.ry, sz, sz);
      }
    });
    ctx.globalAlpha = 1;

    if(!typed && t > GATHER*0.8){ typed = true; typeText(); }
    requestAnimationFrame(frame);
  }

  function typeText(){
    let i = 0;
    const caret = '<span class="caret"></span>';
    const step = () => {
      i++;
      quote.innerHTML = TEXT.slice(0,i) + caret;
      if(i < TEXT.length) setTimeout(step, 190);
    };
    step();
  }

  // start
  let started = false;
  document.getElementById('openBtn').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hide');
    audio.volume = .75;
    audio.play().catch(()=>{});
    if(!started){ started = true; t0 = null; requestAnimationFrame(frame); }
  });

  const musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', () => {
    if(audio.paused){ audio.play(); musicBtn.textContent = '🎵'; }
    else { audio.pause(); musicBtn.textContent = '🔇'; }
  });

  // draw a first dark frame behind the intro
  ctx.fillStyle = '#04040c'; ctx.fillRect(0,0,W,H);
})();
</script>
</body>
</html>
